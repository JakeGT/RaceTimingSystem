<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <link rel ="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Race Timing System{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Styles -->
    <style>
        /* Default Light Mode Styles */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7fc;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .navbar {
            background-color: #0069d9;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
        }

        .nav-link {
            color: #ffffff !important;
            background-color: #007bff;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            background-color: #0056b3;
            border: 1px solid #004085;
        }

        .content-area {
            margin-top: 90px;
            flex-grow: 1;
        }

        footer {
            background-color: #212529;
            color: #fff;
            padding: 15px;
            text-align: center;
            position: relative;
            bottom: 0;
            width: 100%;
        }

        /* Dark Mode Styles */
        body.dark-mode {
            background-color: #121212;
            color: #e0e0e0;
        }

        .dark-mode .navbar {
            background-color: #1f1f1f;
        }

        .dark-mode .nav-link {
            background-color: #333;
            color: #fff !important;
            border: 1px solid #444;
        }

        .dark-mode .nav-link:hover {
            background-color: #555;
            border: 1px solid #666;
        }

        .dark-mode footer {
            background-color: #181818;
        }

        .dark-mode-toggle {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            margin-left: 15px;
        }

        .dark-mode .form-control {
            background-color: #222 !important;
            color: #fff !important;
            border: 1px solid #555 !important;
        }

        .dark-mode .form-control::placeholder {
            color: #bbb !important;
        }

        .dark-mode .form-control:focus {
            background-color: #2a2a2a !important;
            border-color: #007bff !important;
            color: #fff !important;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }

        .dark-mode .card {
            background-color: #222 !important;
            color: #fff !important;
            border: 1px solid #444 !important;
        }

        .dark-mode .card-title {
            color: #fff !important;
        }

        .dark-mode .card-text {
            color: #ccc !important;
        }

        .dark-mode .list-group-item {
            background-color: #222 !important;
            color: #fff !important;
            border-color: #444 !important;
        }

        .dark-mode .list-group-item:hover {
            background-color: #333 !important;
            color: #fff !important;
        }

        .dark-mode .alert {
            background-color: #333 !important;
            color: #fff !important;
            border-color: #444 !important;
        }

        .dark-mode .modal-content {
            background-color: #222 !important;
            color: #fff !important;
            border: 1px solid #444 !important;
        }

        .dark-mode .modal-header {
            background-color: #333 !important;
            border-bottom: 1px solid #444 !important;
            color: #fff !important;
        }

        .dark-mode .modal-footer {
            background-color: #333 !important;
            border-top: 1px solid #444 !important;
            color: #fff !important
        }

        .dark-mode .invalid-feedback {
            color: #ff3860 !important;
        }

        .dark-mode .valid-feedback {
            color: #4CAF50 !important;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Race Timing System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
                    </li>
                    {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link nav-icon" href="{% url 'profile' %}">
                            <i class="bi bi-person-circle"></i>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-icon" href="{% url 'settings' %}">
                            <i class="bi bi-gear"></i>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'logout' %}">Logout</a>
                    </li>
                    {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'login' %}">Login</a>
                    </li>
                    {% endif %}

                    <!-- Dark Mode Toggle Button -->
                    <li class="nav-item">
                        <button class="dark-mode-toggle" onclick="toggleDarkMode()">
                            <i class="bi bi-moon" id="darkModeIcon"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div class="container content-area">
        {% block content %} {% endblock %}
    </div>

    <!-- Footer -->
    <footer>
        <p>2025 Race Timing System</p>
    </footer>

    <!-- JavaScript for Dark Mode -->
    <script>
        function toggleDarkMode() {
            let body = document.body;
            let icon = document.getElementById("darkModeIcon");
            let isDark = body.classList.toggle("dark-mode");

            // Save user preference in localStorage
            localStorage.setItem("darkMode", isDark);

            // Change icon dynamically
            icon.classList.toggle("bi-moon", !isDark);
            icon.classList.toggle("bi-sun", isDark);
        }

        // Load user preference on page load
        (function () {
            let isDark = localStorage.getItem("darkMode") === "true";
            if (isDark) {
                document.body.classList.add("dark-mode");
                document.getElementById("darkModeIcon").classList.replace("bi-moon", "bi-sun");
            }
        })();
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</body>
</html>
