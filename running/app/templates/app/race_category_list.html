{% extends 'base.html' %}

{% block title %}Race Categories{% endblock %}

{% block content %}
<div class="container mt-5">
    <!-- Page Header -->
    <h2 class="text-center mb-4">Race Categories</h2>

    <!-- Race Categories List -->
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="card-title mb-0">Available Race Categories</h4>
        </div>
        <div class="card-body">
            <ul class="list-group">
                {% for category in categories %}
                    <li class="list-group-item">{{ category.name }}</li>
                {% endfor %}
            </ul>
        </div>
    </div>

    <!-- Buttons -->
    <div class="text-center mt-4">
        <a href="{% url 'race_category_create' %}" class="btn btn-primary btn-lg">Add Race Category</a>
        <a href="{% url 'race_config' %}" class="btn btn-secondary btn-lg ml-2">Back to Race Configuration</a>
    </div>
</div>
{% endblock %}
