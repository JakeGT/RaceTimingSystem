{% extends 'base.html' %}

{% block title %}Confirm Participant Deletion{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="text-center">Confirm Deletion</h1>
    <p class="lead text-center">Are you sure you want to delete the participant <strong>{{ participant.name }}</strong> from the race <strong>{{ race.name }}</strong>?</p>

    <div class="d-flex justify-content-center gap-3 mb-4">
        <form action="{% url 'delete_participant' race_id=race.id participant_id=participant.id %}" method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger btn-lg">Delete Participant</button>
        </form>
        <a href="{% url 'organiser_race_detail' race_id=race.id %}" class="btn btn-secondary btn-lg">Cancel</a>
    </div>
</div>
{% endblock %}
