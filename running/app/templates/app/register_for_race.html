<!-- running/app/templates/app/register_for_race.html -->

{% extends 'base.html' %}

{% block title %}Register for a Race{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="text-center">Register for a Race</h1>

    {% if races %}
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="race-select">Choose a Race:</label>
                <select id="race-select" name="race_id" class="form-select">
                    {% for race in races %}
                        <option value="{{ race.id }}">{{ race.name }} - {{ race.date }} at {{ race.start_time }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
    {% else %}
        <p>No upcoming races available for registration.</p>
    {% endif %}
</div>
{% endblock %}
