{% extends 'base.html' %}

{% block title %}Race Created - Race Timing System{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white text-center">
                    <h2>Race Created Successfully</h2>
                </div>
                <div class="card-body text-center">
                    <p class="lead">
                        "<strong>{{ race.name }}</strong>" has been saved successfully.
                    </p>

                    <hr>

                    <h5 class="mt-4">Secure Token</h5>
                    <p class="text-muted mb-2">This token has also been sent to your email.</p>

                    <div class="input-group mb-3 justify-content-center">
                        <input type="text" id="tokenInput" class="form-control text-center text-monospace font-weight-bold bg-light p-3 rounded" value="{{ token }}" readonly style="max-width: 400px;">
                        <button class="btn btn-outline-secondary ms-2" type="button" id="copyButton">Copy</button>
                    </div>

                    <a href="{% url 'dashboard' %}" class="btn btn-primary mt-3">Go to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Copy Button -->
<script>
    document.getElementById('copyButton').addEventListener('click', function() {
        const tokenInput = document.getElementById('tokenInput');
        tokenInput.select();
        tokenInput.setSelectionRange(0, 99999);
        document.execCommand('copy');
        alert('Token copied to clipboard!');
    });
</script>
{% endblock %}
