{% extends 'base.html' %}

{% block title %}Race Configuration - Race Timing System{% endblock %}

{% block content %}
<div class="container mt-5">

    <!-- Page Header -->
    <div class="row">
        <div class="col-12">
            <h1 class="display-4 text-center">Race Configuration</h1>
            <p class="lead text-center text-muted">Set up an empty race configuration below</p>
        </div>
    </div>

    <!-- Form Section -->
    <div class="row">
        <div class="col-12 col-md-8 offset-md-2">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h3 class="card-title mb-0">Configure Your Race</h3>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}

                        <!-- Race Name -->
                        <div class="form-group mb-4">
                            <label for="race_name">Race Name</label>
                            <input type="text" name="race_name" id="race_name" class="form-control" placeholder="Enter the name of your race (e.g., 'Spring 5k')"
                                value="{{ saved_data.race_name|default:'' }}" required>
                        </div>

                        <!-- Race Date -->
                        <div class="form-group mb-4">
                            <label for="race_date">Race Date</label>
                            <input type="text" name="race_date" id="race_date" class="form-control"
                                value="{{ saved_data.race_date|default:'' }}" required>
                        </div>

                        <!-- Race Start Time -->
                        <div class="form-group mb-4">
                            <label for="start_time">Start Time</label>
                            <input type="text" name="start_time" id="start_time" class="form-control"
                                value="{{ saved_data.start_time|default:'' }}" required>
                        </div>

                        <!-- Select Race Category (Single Selection) -->
                        <div class="form-group mb-4">
                            <label for="race_category">Race Category</label>
                            <select name="race_category" id="race_category" class="form-control">
                                <option value="" {% if not saved_data.race_category %}selected{% endif %}>None</option>
                                {% for category in race_categories %}
                                    <option value="{{ category.id }}" {% if category.id|stringformat:"s" == saved_data.race_category|stringformat:"s" %}selected{% endif %}>{{ category.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Select Participant Categories (Multiple Selection) -->
                        <div class="form-group mb-4">
                            <label for="participant_categories">Participant Categories</label>
                            <select name="participant_categories" id="participant_categories" class="form-control" multiple>
                                <option value="" disabled>None</option>
                                {% for category in participant_categories %}
                                    <option value="{{ category.id }}" {% if saved_data.participant_categories and category.id|stringformat:"s" in saved_data.participant_categories %}selected{% endif %}>{{ category.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Buttons to Manage Categories -->
                        <div class="d-flex justify-content-between mb-4">
                            <a href="{% url 'category_list' %}" class="btn btn-info">Manage Participant Categories</a>
                            <a href="{% url 'race_category_list' %}" class="btn btn-warning">Manage Race Categories</a>
                        </div>

                        <!-- Checkbox to Opt Out of Location Configuration -->
                        <div class="form-group mb-4">
                            <label for="no_location">
                                <input type="checkbox" id="no_location" name="no_location" {% if saved_data.no_location %}checked{% endif %}>
                                No location required for this race
                            </label>
                        </div>

                        <!-- OpenStreetMap for selecting the location -->
                        <div id="map" style="height: 400px; width: 100%;"></div>

                        <!-- Location Fields -->
                        <div id="location-fields" class="mt-4">
                            <div class="form-group">
                                <label for="race_location">Race Location</label>
                                <input type="text" id="race_location" class="form-control" placeholder="Select the race location" 
                                    value="{{ saved_data.race_location|default:'' }}" readonly required>
                            </div>

                            <!-- Latitude and Longitude -->
                            <input type="hidden" name="latitude" id="latitude" value="{{ saved_data.latitude|default:'' }}">
                            <input type="hidden" name="longitude" id="longitude" value="{{ saved_data.longitude|default:'' }}">
                        </div>

                        <!-- Submit Button -->
                        <div class="form-group text-center mt-4">
                            <input type="submit" value="Create Race" class="btn btn-success btn-lg">
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Flatpickr styles and scripts -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<!-- Leaflet.js styles and scripts -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        
        //  initialise Flatpickr for date and time
        flatpickr("#race_date", {
            dateFormat: "Y-m-d",
            allowInput: true
        });

        flatpickr("#start_time", {
            enableTime: true,
            noCalendar: true,
            dateFormat: "H:i",
            time_24hr: true,
            allowInput: true
        });

        //  toggle location fields visibility based on 'No location required' checkbox
        const noLocationCheckbox = document.getElementById('no_location');
        const locationFields = document.getElementById('location-fields');
        const mapDiv = document.getElementById('map');

        //  check the state of the checkbox when the page loads
        if (noLocationCheckbox.checked) {
            locationFields.style.display = 'none';
            mapDiv.style.display = 'none';
        }

        //  listen for changes to the checkbox
        noLocationCheckbox.addEventListener('change', function () {
            if (noLocationCheckbox.checked) {
                locationFields.style.display = 'none';
                mapDiv.style.display = 'none';
                document.getElementById('latitude').disabled = true;
                document.getElementById('longitude').disabled = true;
            } else {
                locationFields.style.display = 'block';
                mapDiv.style.display = 'block';
                document.getElementById('latitude').disabled = false;
                document.getElementById('longitude').disabled = false;
            }
        });

        //  initialise Leaflet map at campus
        const map = L.map('map').setView([50.7374, -3.5354], 15);

        //  add OpenStreetMap tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        //  add draggable marker at campus
        const marker = L.marker([50.7374, -3.5354], { draggable: true }).addTo(map);

        //  update latitude and longitude fields
        marker.on('dragend', function (e) {
            const position = e.target.getLatLng();
            document.getElementById("latitude").value = position.lat;
            document.getElementById("longitude").value = position.lng;
            
            fetch(`https://nominatim.openstreetmap.org/reverse?lat=${position.lat}&lon=${position.lng}&format=json`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById("race_location").value = data.display_name || 'Unknown Location';
                });
        });

        //  when the user clicks on the map place marker and update fields
        map.on('click', function (e) {
            const position = e.latlng;
            marker.setLatLng(position);
            document.getElementById("latitude").value = position.lat;
            document.getElementById("longitude").value = position.lng;

            fetch(`https://nominatim.openstreetmap.org/reverse?lat=${position.lat}&lon=${position.lng}&format=json`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById("race_location").value = data.display_name || 'Unknown Location';
                });
        });
    });
</script>

{% endblock %}
