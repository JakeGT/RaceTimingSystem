{% extends 'base.html' %}

{% block title %}Race Configuration - Race Timing System{% endblock %}

{% block content %}
<div class="container mt-5">

    <!-- Page Header -->
    <div class="row">
        <div class="col-12">
            <h1 class="display-4 text-center">Race Configuration</h1>
            <p class="lead text-center text-muted">Configure the race details below</p>
        </div>
    </div>

    <!-- Form Section -->
    <div class="row">
        <div class="col-12 col-md-8 offset-md-2">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h3 class="card-title mb-0">Configure Race Details</h3>
                </div>
                <div class="card-body">
                    <form method="POST">
                        {% csrf_token %}

                        <!-- Race Name -->
                        <div class="form-group mb-4">
                            <label for="race_name">Race Name</label>
                            <input type="text" name="race_name" id="race_name" class="form-control" placeholder="Enter race name" required>
                        </div>

                        <!-- Race Date -->
                        <div class="form-group mb-4">
                            <label for="race_date">Race Date</label>
                            <input type="date" name="race_date" id="race_date" class="form-control" required>
                        </div>

                        <!-- Race Start Time -->
                        <div class="form-group mb-4">
                            <label for="start_time">Start Time</label>
                            <input type="time" name="start_time" id="start_time" class="form-control" required>
                        </div>

                        <!-- Race Categories -->
                        <div class="form-group mb-4">
                            <label for="race_categories">Race Categories</label>
                            <select name="race_categories" id="race_categories" class="form-control" multiple required>
                                <option value="5k">5k</option>
                                <option value="10k">10k</option>
                                <option value="half_marathon">Half Marathon</option>
                                <option value="marathon">Marathon</option>
                            </select>
                            <small class="form-text text-muted">Select multiple categories if applicable.</small>
                        </div>

                        <!-- Submit Button -->
                        <div class="form-group text-center">
                            <input type="submit" value="Save Configuration" class="btn btn-success btn-lg">
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
