{% extends 'base.html' %}

{% block title %}Participant Categories{% endblock %}

{% block content %}
<div class="container mt-5">
    <!-- Page Header -->
    <h2 class="text-center mb-4">Participant Categories</h2>

    <!-- Card for Category List -->
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="card-title mb-0">Available Categories</h4>
        </div>
        <div class="card-body">
            <ul class="list-group">
                {% for category in categories %}
                    <li class="list-group-item">{{ category.name }}</li>
                {% endfor %}
            </ul>
        </div>
    </div>

    <!-- Manage Categories Buttons -->
    <div class="d-flex justify-content-between mt-4">
        <a href="{% url 'category_create' %}" class="btn btn-primary">Add Category</a>
        <a href="{% url 'race_config' %}" class="btn btn-secondary">Back to Race Configuration</a>
    </div>
</div>
{% endblock %}
