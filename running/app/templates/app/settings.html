<!-- running/app/templates/app/settings.html -->

{% extends 'base.html' %}

{% block title %}Settings - Race Timing System{% endblock %}

{% block content %}
<div class="container mt-5">
    <!-- Page Header -->
    <div class="row">
        <div class="col-12 text-center">
            <h1 class="display-4">Account Settings</h1>
            <p class="lead text-muted">Manage your account details and preferences</p>
        </div>
    </div>

    <!-- Settings Form -->
    <div class="row mt-4">
        <div class="col-md-8 offset-md-2">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h3 class="card-title mb-0">Profile Settings</h3>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}

                        <!-- Username Field -->
                        <div class="form-group mb-3">
                            <label for="id_username" class="form-label">Username</label>
                            <input type="text" id="id_username" name="username" class="form-control" value="{{ user.username }}" required>
                        </div>

                        <!-- Email Field -->
                        <div class="form-group mb-3">
                            <label for="id_email" class="form-label">Email</label>
                            <input type="email" id="id_email" name="email" class="form-control" value="{{ user.email }}" required>
                        </div>
                    
                        <!-- First Name Field -->
                        <div class="form-group mb-3">
                            <label for="id_first_name" class="form-label">First Name</label>
                            <input type="text" id="id_first_name" name="first_name" class="form-control" 
                                   value="{{ user.first_name }}" 
                                   pattern="^[A-Za-z]+$" 
                                   title="First name should contain only letters" 
                                   required>
                        </div>
                        
                        <!-- Last Name Field -->
                        <div class="form-group mb-3">
                            <label for="id_last_name" class="form-label">Last Name</label>
                            <input type="text" id="id_last_name" name="last_name" class="form-control" 
                                   value="{{ user.last_name }}" 
                                   pattern="^[A-Za-z]+$" 
                                   title="Last name should contain only letters" 
                                   required>
                        </div>

                        <!-- Change Password Link -->
                        <div class="form-group mb-3">
                            <label class="form-label">Password</label>
                            <div>
                                <a href="{% url 'password_change' %}" class="btn btn-warning">Change Password</a>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="text-center">
                            <button type="submit" class="btn btn-success">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
