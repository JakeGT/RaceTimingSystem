{% extends 'base.html' %}

{% block title %}Create New Race Category{% endblock %}

{% block content %}
<div class="container mt-5">
    <!-- Page Header -->
    <h2 class="text-center mb-4">Create New Race Category</h2>

    <!-- Card for Form -->
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="card-title mb-0">Race Category Details</h4>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <div class="form-group mb-4">
                    <label for="id_name">Category Name</label>
                    {{ form.name }}
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-primary btn-lg">Create Category</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Back Buttons -->
    <div class="text-center mt-4">
        <a href="{% url 'race_category_list' %}" class="btn btn-secondary btn-lg">Back to Race Categories</a>
        <a href="{% url 'race_config' %}" class="btn btn-secondary btn-lg ml-2">Back to Race Configuration</a>
    </div>
</div>
{% endblock %}
