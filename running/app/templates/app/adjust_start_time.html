{% extends 'base.html' %}

{% block title %}Adjust Start Time - {{ race.name }}{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="text-center">Adjust Start Time for {{ race.name }}</h1>
    <p class="lead text-muted text-center">Update the race start time below:</p>

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_start_time">New Start Time</label>
            {{ form.start_time }}
        </div>

        <div class="text-center mt-4">
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
    </form>

    <div class="mt-4 text-center">
        <a href="{% url 'organiser_race_detail' race.id %}" class="btn btn-secondary">Back to Race Details</a>
    </div>
</div>
{% endblock %}
