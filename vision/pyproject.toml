[project]
name = "racevision"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5",
    "supervision>=0.31.7",
    "trackers>=2.7.0,<2.8",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "scipy>=1.18",
    "scipy-stubs>=1.18.1.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
