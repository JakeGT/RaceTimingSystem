name: Django CI

on:
  push:
    branches:
      - main
      - dev
      - feature/ui
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r running/requirements.txt

      - name: Run Migrations
        working-directory: running
        run: |
          python manage.py migrate

      - name: Run Tests
        working-directory: running
        run: |
          python manage.py test running
