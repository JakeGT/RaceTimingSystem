# Shared Ruff config for server/ and vision/.
line-length = 100
target-version = "py313"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "DJ", "S", "RUF"]
ignore = []

[lint.per-file-ignores]
"**/tests/**" = ["S101"]
"server/config/test_settings.py" = ["S105"]

[lint.isort]
known-first-party = ["config", "core", "racevision"]
