version = 1
SPDX-PackageName = "Race Timing System"
SPDX-PackageDownloadLocation = "https://github.com/JakeGT/RaceTimingSystem"

# Files that can't carry an SPDX header (config, lock files, docs, markup) or are
# generated (Django migrations).
[[annotations]]
path = [
  "**/migrations/*.py",
  "**/*.md",
  "**/*.toml",
  "**/*.json",
  "**/*.yaml",
  "**/*.yml",
  "**/*.lock",
  "**/*.html",
  "**/.gitignore",
  "**/.dockerignore",
  "**/.prettierignore",
  "**/.python-version",
  ".editorconfig",
  "**/.env.example",
  "LICENSE",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Race Timing System contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"
